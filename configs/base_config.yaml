# ============================================================
# DermaSense AI — Base Configuration
# Dùng chung cho mọi giai đoạn
# ============================================================

project:
  name: "DermaSense_AI"
  version: "0.1.0"
  description: "Multi-stage Dermatology Screening System"

# --- Paths ---
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_clinical: "data/clinical"
  checkpoints: "models/checkpoints"
  baselines: "models/baselines"
  exported: "models/exported"
  outputs: "outputs"
  figures: "outputs/figures"
  logs: "outputs/logs"
  xai_heatmaps: "outputs/xai_heatmaps"

# --- Kaggle Paths (khi chạy trên Kaggle Notebooks) ---
kaggle:
  input_dir: "/kaggle/input"
  working_dir: "/kaggle/working"
  isic_dataset: "/kaggle/input/isic-2019"  # Kaggle dataset slug: andrewmvd/isic-2019

# --- Reproducibility ---
seed: 42

# --- Data Split ---
data_split:
  train: 0.70
  val: 0.15
  test: 0.15

# --- Device (tự động detect) ---
# Trên Kaggle: cuda (GPU T4 miễn phí)
# Trên local: cpu (chỉ dùng để code & test)
device: "auto"  # auto | cuda | cpu

# --- Experiment Tracking ---
wandb:
  project: "DermaSense_AI"
  entity: null  # Điền W&B username nếu cần
  enabled: true

# --- ISIC/DermNet Dataset Labels ---
labels:
  # 23 lớp bệnh học DermNet
  classes:
    - "Acne and Rosacea"
    - "Actinic Keratosis and Skin Cancer"
    - "Atopic Dermatitis"
    - "Bullous Disease"
    - "Cellulitis and Bacterial Infections"
    - "Eczema"
    - "Exanthems and Drug Eruptions"
    - "Hair Loss"
    - "Herpes and HPV"
    - "Light Diseases and Pigmentation"
    - "Lupus and Connective Tissue"
    - "Melanoma and Nevi"
    - "Nail Fungus"
    - "Poison Ivy and Contact Dermatitis"
    - "Psoriasis and Lichen Planus"
    - "Scabies and Lyme"
    - "Seborrheic Keratoses and Benign Tumors"
    - "Systemic Diseases"
    - "Tinea and Fungal Infections"
    - "Urticaria Hives"
    - "Vascular Tumors"
    - "Vasculitis"
    - "Warts and Molluscum"
  
  # Nhãn nhị phân cho Stage A (Safety Screener)
  # Nhóm rủi ro cao (Severe)
  high_risk: 
    - "Actinic Keratosis and Skin Cancer"
    - "Bullous Disease"
    - "Lupus and Connective Tissue"
    - "Melanoma and Nevi"
    - "Systemic Diseases"
    - "Vasculitis"
  # Nhóm rủi ro thấp (Mild/Moderate)
  low_risk: 
    - "Acne and Rosacea"
    - "Atopic Dermatitis"
    - "Cellulitis and Bacterial Infections"
    - "Eczema"
    - "Exanthems and Drug Eruptions"
    - "Hair Loss"
    - "Herpes and HPV"
    - "Light Diseases and Pigmentation"
    - "Nail Fungus"
    - "Poison Ivy and Contact Dermatitis"
    - "Psoriasis and Lichen Planus"
    - "Scabies and Lyme"
    - "Seborrheic Keratoses and Benign Tumors"
    - "Tinea and Fungal Infections"
    - "Urticaria Hives"
    - "Vascular Tumors"
    - "Warts and Molluscum"

# --- Risk Mapping (Stage B → 3 mức nguy cơ) ---
risk_levels:
  high:
    label: "Cần khám ngay"
    classes: 
      - "Actinic Keratosis and Skin Cancer"
      - "Bullous Disease"
      - "Lupus and Connective Tissue"
      - "Melanoma and Nevi"
      - "Systemic Diseases"
      - "Vasculitis"
    threshold: 0.6          # Xác suất cao → gửi bác sĩ
  medium:
    label: "Cần theo dõi / Điều trị y tế"
    classes: 
      - "Atopic Dermatitis"
      - "Cellulitis and Bacterial Infections"
      - "Eczema"
      - "Exanthems and Drug Eruptions"
      - "Herpes and HPV"
      - "Poison Ivy and Contact Dermatitis"
      - "Psoriasis and Lichen Planus"
      - "Scabies and Lyme"
      - "Vascular Tumors"
    threshold: 0.5
  low:
    label: "Tự chăm sóc tại nhà"
    classes: 
      - "Acne and Rosacea"
      - "Hair Loss"
      - "Light Diseases and Pigmentation"
      - "Nail Fungus"
      - "Seborrheic Keratoses and Benign Tumors"
      - "Tinea and Fungal Infections"
      - "Urticaria Hives"
      - "Warts and Molluscum"
    threshold: 0.5
