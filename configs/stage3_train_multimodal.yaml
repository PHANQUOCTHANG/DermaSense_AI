# ============================================================
# DermaSense AI — Stage 3: Train Multimodal Configuration
# Huấn luyện mô hình Đa phương thức (Ảnh + Lâm sàng) - 23 Classes
# ============================================================

model:
  vision_name: "tf_efficientnetv2_m.in21k_ft_in1k"
  num_classes: 23
  clinical_in_features: 7
  clinical_out_features: 64
  pretrained: true

data:
  batch_size: 16
  num_workers: 0
  img_size: 384
  clinical_csv_path: "data/raw/metadata.csv"

training:
  # Chiến lược 2-Step Training
  step1:
    epochs: 3
    lr: 0.001
    weight_decay: 0.01
    description: "Freeze Vision Branch, chỉ train Fusion Head"
    
  step2:
    epochs: 20
    lr: 0.00005
    weight_decay: 0.01
    description: "Unfreeze toàn bộ, Fine-tune nhẹ nhàng"

  # Cấu hình chung
  focal_loss_gamma: 2.0
  early_stopping_patience: 7
  
  # Checkpoint saving
  checkpoint_dir: "models/checkpoints/stage_b"

