# ============================================================
# DermaSense AI — Stage 3: Multimodal Training Configuration
# ============================================================

# --- Stage A: Safety Screener (Binary) ---
stage_a:
  model:
    backbone: "tf_efficientnetv2_s"  # timm model name
    pretrained: true
    num_classes: 2                    # binary: high_risk vs low_risk
    drop_rate: 0.3
    drop_path_rate: 0.2
  
  # Kết hợp ABCDE features
  abcde_fusion:
    enabled: true
    num_abcde_features: 5            # Asymmetry, Border, Color, Diameter, Evolution
    fusion_method: "concat"           # concat | attention
    hidden_dim: 128

  training:
    epochs: 30
    batch_size: 32                    # Kaggle T4: 32 vừa đủ RAM
    learning_rate: 1.0e-4
    weight_decay: 1.0e-5
    scheduler: "cosine"
    warmup_epochs: 3
    early_stopping_patience: 7
  
  threshold:
    optimize_for: "sensitivity"
    min_sensitivity: 0.95
    min_npv: 0.97

# --- Stage B: Multimodal 7-class Classifier ---
stage_b:
  # Vision Branch
  vision:
    backbone: "tf_efficientnetv2_m"   # timm model name
    pretrained: true
    feature_dim: 1280                 # EfficientNetV2-M feature dimension
    drop_rate: 0.4
    drop_path_rate: 0.2
  
  # Clinical Branch (MLP)
  clinical:
    input_features:
      - age                           # continuous, StandardScaler
      - sex                           # categorical, OneHot
      - anatom_site                   # categorical, Embedding
      - duration                      # continuous
      - symptoms                      # multi-label (itch, bleeding, pain)
    hidden_dims: [128, 64]
    dropout: 0.3
    embedding_dim: 16                 # cho anatom_site embedding

  # Fusion Layer
  fusion:
    method: "concat"                  # concat | gating | attention
    hidden_dim: 256
    num_classes: 7
    dropout: 0.3

  training:
    epochs: 50
    batch_size: 24                    # Kaggle T4: 24 cho EfficientNetV2-M
    learning_rate: 5.0e-5
    weight_decay: 1.0e-4
    scheduler: "cosine"
    warmup_epochs: 5
    early_stopping_patience: 10
    
    # 2-step training strategy
    two_step:
      enabled: true
      step1_freeze_vision_epochs: 5   # Train fusion layer only
      step1_lr: 1.0e-3

  # Baselines để so sánh
  baselines:
    - name: "resnet50_baseline"
      backbone: "resnet50"
      pretrained: true
      num_classes: 7
    - name: "efficientv2_no_fusion"
      backbone: "tf_efficientnetv2_m"
      pretrained: true
      num_classes: 7
      # Không dùng clinical branch

# --- Data Split ---
data_split:
  train: 0.7
  val: 0.15
  test: 0.15
  stratified: true
