# ============================================================
# DermaSense AI — DVC Pipeline
# Định nghĩa các bước pipeline để reproducibility
# ============================================================

stages:
  # Stage 1: Tiền xử lý dữ liệu
  preprocess:
    cmd: python -m src.pipelines.run_stage1_preprocess
    deps:
      - data/raw/
      - src/data/preprocessing.py
      - configs/stage1_preprocessing.yaml
    outs:
      - data/processed/

  # Stage 2: Huấn luyện Safety Screener (Binary)
  train_screener:
    cmd: python -m src.pipelines.run_stage2_train_screener
    deps:
      - data/processed/
      - src/models/vision_branch.py
      - configs/stage2_balancing.yaml
      - configs/stage3_train_multimodal.yaml
    outs:
      - models/checkpoints/stage_a/
    metrics:
      - outputs/logs/stage_a_metrics.json:
          cache: false

  # Stage 3: Huấn luyện Multimodal 7-class Classifier
  train_multimodal:
    cmd: python -m src.pipelines.run_stage3_train_multimodal
    deps:
      - data/processed/
      - data/clinical/
      - src/models/vision_branch.py
      - src/models/clinical_branch.py
      - src/models/fusion_net.py
      - configs/stage2_balancing.yaml
      - configs/stage3_train_multimodal.yaml
    outs:
      - models/checkpoints/stage_b/
    metrics:
      - outputs/logs/stage_b_metrics.json:
          cache: false

  # Stage 4: Đánh giá & Explainable AI
  evaluate_xai:
    cmd: python -m src.pipelines.run_stage4_eval_xai
    deps:
      - models/checkpoints/stage_a/
      - models/checkpoints/stage_b/
      - src/xai/gradcam.py
      - src/xai/calibration.py
      - src/xai/iou_evaluator.py
      - configs/stage4_xai_eval.yaml
    outs:
      - outputs/xai_heatmaps/
      - outputs/figures/

  # Stage 5: Export ONNX
  export_onnx:
    cmd: python -m src.pipelines.run_stage5_export_onnx
    deps:
      - models/checkpoints/stage_b/
      - src/models/fusion_net.py
    outs:
      - models/exported/
